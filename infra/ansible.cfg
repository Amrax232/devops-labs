# Настройки Ansible (ЛР7). Запуск — из каталога infra/ (make infra-*).
[defaults]
roles_path = roles
collections_path = collections
interpreter_python = /usr/bin/python3
retry_files_enabled = False
callback_result_format = yaml
display_skipped_hosts = False
forks = 5
nocows = True

[ssh_connection]
# Ключи узлов закреплены в infra/known_hosts (make infra-known-hosts) и
# проверяются строго: подмена сервера обнаруживается, а не принимается молча.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes
pipelining = True
