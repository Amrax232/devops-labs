---
# Служебная учётная запись Ansible. Используется и в bootstrap.yml (первый
# запуск на чистой машине), и в составе роли users.
- name: Проверить, что задан открытый ключ ansible этого окружения
  ansible.builtin.assert:
    that: users_ansible_public_key is match('^ssh-(ed25519|rsa) ')
    fail_msg: "Нет ключа ansible: выполните infra/scripts/keygen.sh {{ env_name | default('<окружение>') }}"
    quiet: true

- name: Создать учётную запись ansible
  ansible.builtin.user:
    name: "{{ users_ansible_name }}"
    comment: "Ansible: управление конфигурацией"
    shell: /bin/bash
    groups: []
    append: false
    password: "!"
    update_password: always

- name: Разрешить вход ansible только по ключу и только из лабораторной сети
  ansible.posix.authorized_key:
    user: "{{ users_ansible_name }}"
    key: "{{ users_ansible_public_key }}"
    key_options: 'from="{{ users_ansible_sources }}",no-agent-forwarding,no-X11-forwarding,no-port-forwarding'
    exclusive: true

- name: Разрешить ansible sudo без пароля (нужно для управления системой)
  ansible.builtin.template:
    src: sudoers-ansible.j2
    dest: /etc/sudoers.d/90-ansible
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
