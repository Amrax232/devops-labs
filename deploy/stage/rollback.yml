# Возврат предыдущей версии: схема БД не откатывается.
#
# Миграции пишутся совместимыми назад (сначала расширить схему, удалять
# старое — отдельным выпуском), поэтому предыдущая версия работает на
# текущей схеме. Её migrate не знает новых ревизий и упал бы на
# «alembic upgrade head», поэтому при возврате он ничего не применяет.
# Если схему всё же нужно вернуть — копия, снятая перед выпуском
# (STAGE_DIR/backups/pre-deploy-*.dump), и make restore.
services:
  migrate:
    command: ["python", "-c", "print('Возврат версии: схема БД не изменяется')"]
