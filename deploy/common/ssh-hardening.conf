# Ограничения SSH. Файл кладётся в /etc/ssh/sshd_config.d/10-hardening.conf
# и переопределяет значения из основного sshd_config.

# Вход суперпользователя по сети запрещён: администрируем через sudo.
PermitRootLogin no

# Только ключи. Пароли отключены полностью, включая пустые.
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# Кто вообще может подключаться.
AllowUsers __ADMIN_USER__

# Прочие ограничения.
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
