# Контейнерное окружение «Складской учёт» (ЛР4).
#
#   клиент ──► nginx :8080 ──┬──► app1 :8000 ──┐
#   (edge)      (балансир)   └──► app2 :8000 ──┴──► db :5432 (том db_data)
#                    app_net (внутренняя)          db_net (внутренняя)
#
# - наружу опубликован только порт nginx; приложение и БД доступны лишь
#   во внутренних сетях (internal: true — без выхода наружу);
# - migrate — разовый контейнер: применяет миграции и завершается; приложение
#   стартует только после его успешного завершения и готовности БД;
# - данные БД — в именованном томе db_data: переживают пересоздание
#   контейнеров и обновление образа (удаляются только docker compose down -v);
# - секреты не хранятся ни в образе, ни в этом файле: подставляются из .env.
#
# Порт PostgreSQL для локальной разработки (make run, интеграционные тесты)
# открывается отдельным файлом docker-compose.dev.yml и только на 127.0.0.1.
# Обоснование ограничений ресурсов — docs/containers.md.

name: warehouse-inventory

# ---------------------------------------------------------- общие параметры
x-app-common: &app-common
  image: warehouse-inventory:${APP_VERSION:-0.8.0}
  build:
    context: .
    args:
      APP_VERSION: ${APP_VERSION:-0.8.0}
      VCS_REF: ${VCS_REF:-local}
      SOURCE_URL: ${SOURCE_URL:-}
  user: "10001:10001"
  init: true                       # tini: PID 1, передаёт сигналы, собирает зомби
  read_only: true                  # корневая ФС только на чтение
  tmpfs:
    - /tmp:size=16m
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-env: &app-env
  APP_NAME: warehouse-inventory
  APP_ENV: container
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD:-warehouse}@db:5432/${POSTGRES_DB:-warehouse}
  AUTH_USERNAME: ${AUTH_USERNAME:-admin}
  AUTH_PASSWORD: ${AUTH_PASSWORD:?задайте AUTH_PASSWORD в .env}

x-app-service: &app-service
  <<: *app-common
  restart: unless-stopped
  stop_grace_period: 20s           # больше, чем --timeout-graceful-shutdown 15 в образе
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  healthcheck:
    # готовность, а не только «процесс жив»: /readyz отвечает 503 без базы данных
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 20s
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 256M
        pids: 64
      reservations:
        memory: 96M

services:
  # ------------------------------------------------------------- база данных
  db:
    image: postgres:16.4-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
    # порта наружу нет: к БД обращаются только migrate, app1 и app2 по сети db_net
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - db_net
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s         # PostgreSQL успевает записать контрольную точку
    healthcheck:
      # -h 127.0.0.1: при первом запуске на пустом томе временный сервер initdb
      # слушает только сокет — по TCP база «готова» лишь после настоящего старта
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 200
        reservations:
          memory: 192M
    logging: *logging

  # ------------------------------------------------- миграции (разовый запуск)
  migrate:
    <<: *app-common
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
      INSTANCE_ID: migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db_net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 32

  # ------------------------------------------------ экземпляры приложения
  app1:
    <<: *app-service
    environment:
      <<: *app-env
      INSTANCE_ID: app-1
      FORWARDED_ALLOW_IPS: 172.30.10.10   # X-Forwarded-* принимаются только от nginx
    networks:
      app_net:
        ipv4_address: 172.30.10.11
      db_net: {}

  app2:
    <<: *app-service
    environment:
      <<: *app-env
      INSTANCE_ID: app-2
      FORWARDED_ALLOW_IPS: 172.30.10.10
    networks:
      app_net:
        ipv4_address: 172.30.10.12
      db_net: {}

  # ------------------------------------------- обратный прокси и балансировщик
  nginx:
    image: nginxinc/nginx-unprivileged:1.27.2-alpine
    restart: unless-stopped
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    ports:
      # единственный опубликованный порт; по умолчанию только на 127.0.0.1
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      edge: {}
      app_net:
        ipv4_address: 172.30.10.10
      monitoring: {}            # /grafana/ проксируется в Grafana
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 64
    logging: *logging

  # ===================================================== наблюдаемость (ЛР8)
  # Метрики: Prometheus собирает их с приложения, Nginx (через blackbox),
  # хоста (node-exporter) и контейнеров (cAdvisor); Grafana — панели, доступна
  # только через Nginx: /grafana/. Портов наружу нет, сеть monitoring внутренняя.
  # Конфигурация — monitoring/ (в репозитории, проверка — make monitoring-lint).

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - app_net                 # экземпляры приложения и Nginx
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 64
    logging: *logging

  grafana:
    image: grafana/grafana-oss:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?задайте GRAFANA_ADMIN_PASSWORD в .env}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:8080/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 128
    logging: *logging

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox:/etc/blackbox:ro
    networks:
      - monitoring
      - app_net                 # проверяет Nginx и экземпляры так же, как пользователь
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 32M
          pids: 32
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    volumes:
      # корень хоста только на чтение: метрики диска, памяти, CPU
      - /:/host:ro
    networks:
      - monitoring
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 64M
          pids: 32
    logging: *logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --enable_metrics=cpu,memory,network,oom_event
      # без переменных окружения и лишних меток контейнеров: пароли из
      # environment не должны попасть в метрики
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    volumes:
      # Исключение из правила «не от root»: cAdvisor читает cgroups и сведения
      # Docker о контейнерах. Всё только на чтение, портов нет, сеть внутренняя.
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M
          pids: 64
    logging: *logging

networks:
  edge: {}                 # единственная сеть с выходом наружу — только у nginx
  app_net:
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24   # фиксированные адреса экземпляров для nginx
          # динамические адреса (Prometheus, blackbox) — только из верхней
          # половины: не займут .10–.12, закреплённые за nginx и экземплярами
          ip_range: 172.30.10.128/25
  db_net:
    internal: true
  monitoring:
    internal: true         # Prometheus, Grafana, экспортёры: без выхода наружу

volumes:
  db_data: {}
  prometheus_data: {}
  grafana_data: {}
