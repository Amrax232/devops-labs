# Nginx — обратный прокси и балансировщик перед экземплярами приложения (ЛР4).
#
# - единственная точка входа: приложение наружу не опубликовано;
# - балансировка round-robin между app1 и app2;
# - экземпляр, не ответивший 2 раза подряд, исключается на 10 с (max_fails,
#   fail_timeout), а запрос повторяется на другом экземпляре
#   (proxy_next_upstream) — пользователь ошибки не видит;
# - ограничение частоты запросов с одного адреса (limit_req) — 429 при превышении;
# - в ответе заголовки X-Instance-Id (от приложения) и X-Upstream (от nginx).
#
# Образ nginx-unprivileged работает не от root (uid 101) и слушает порт 8080;
# корневая ФС контейнера только на чтение, временные файлы — в /tmp (tmpfs).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # в журнале видно, какой экземпляр обработал запрос и были ли повторы
    log_format balanced '$remote_addr [$time_local] "$request" $status '
                        'upstream=$upstream_addr upstream_status=$upstream_status '
                        'instance=$upstream_http_x_instance_id time=$request_time';
    access_log /var/log/nginx/access.log balanced;

    sendfile on;
    keepalive_timeout 30s;

    # Не более 20 запросов в секунду с одного адреса, кратковременный всплеск
    # до 40 запросов пропускается без задержки; сверх этого — 429.
    limit_req_zone $binary_remote_addr zone=per_client:10m rate=20r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    upstream warehouse_app {
        # Адреса экземпляров фиксированы в docker-compose.yml (сеть app_net):
        # nginx не зависит от DNS, если экземпляр остановлен в момент запуска
        # или перезапуска nginx.
        server 172.30.10.11:8000 max_fails=2 fail_timeout=10s;   # app1
        server 172.30.10.12:8000 max_fails=2 fail_timeout=10s;   # app2
        keepalive 16;
        keepalive_timeout 30s;   # меньше --timeout-keep-alive uvicorn (65 с)
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 1m;

        # проверка живости самого nginx (healthcheck контейнера)
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            limit_req zone=per_client burst=40 nodelay;

            proxy_pass http://warehouse_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 1s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Повтор на другом экземпляре при отказе. POST/PATCH/DELETE
            # повторяются, только если запрос ещё не был передан приложению
            # (ошибка соединения), — так операция не выполнится дважды.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;

            add_header X-Upstream $upstream_addr always;
        }
    }
}
