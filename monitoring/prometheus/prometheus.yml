# Prometheus — сбор метрик «Складского учёта» (ЛР8).
# Конфигурация хранится в репозитории; изменения — через merge request
# (make monitoring-lint проверяет её и правила оповещений до запуска).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: warehouse-inventory

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Экземпляры приложения: запросы, ошибки, время ответа, состояние, предметные метрики
  - job_name: warehouse-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app1:8000"]
        labels: {service: app1}
      - targets: ["app2:8000"]
        labels: {service: app2}

  # Доступность снаружи: запросы через Nginx так же, как у пользователя
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx:8080/healthz      # приложение доступно через Nginx
          - http://nginx:8080/readyz       # и готово (база доступна)
          - http://app1:8000/readyz
          - http://app2:8000/readyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - target_label: __address__
        replacement: blackbox:9115

  # Хост: CPU, память, диск, сеть
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Контейнеры: CPU, память относительно лимита, перезапуски
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # только контейнеры (без служебных cgroup) — меньше рядов
      - source_labels: [name]
        regex: ""
        action: drop

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
