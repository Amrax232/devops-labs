# Панели Grafana загружаются из monitoring/grafana/dashboards/ (репозиторий).
apiVersion: 1
providers:
  - name: warehouse
    folder: "Складской учёт"
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana-dashboards
